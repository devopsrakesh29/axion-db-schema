apiVersion: v1
kind: Service
metadata:
  name: {{ include "axion-db-schema.fullname" . }}
  labels:
    {{- include "axion-db-schema.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: postgres
  selector:
    {{- include "axion-db-schema.selectorLabels" . | nindent 4 }}
