apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "axion-db-schema.fullname" . }}
  labels:
    {{- include "axion-db-schema.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "axion-db-schema.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "axion-db-schema.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: postgres
          env:
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
